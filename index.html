<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="cabecera">
        <img src="logoxx.png" alt="Logo del sitio" class="logo">
        <nav>
            <ul class="menu">
                <li><a href="#inicios">Inicio</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#galeria">Galería</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="carrusel">
            <h2>Galería de fotos</h2>
            
            <input type="radio" name="carrusel" id="diapo1" checked>
            <input type="radio" name="carrusel" id="diapo2">
            <input type="radio" name="carrusel" id="diapo3">

            <div class="carrusel-contenedor">
                <div class="diapositivas">
                    <img src="2.jpg" alt="Paisaje 1">
                    <img src="1 (1).jpg" alt="Paisaje 2">
                    <img src="3 (1).jpg" alt="Paisaje 3">
                </div>
            </div>

            <div class="navegacion">
                <label for="diapo1"></label>
                <label for="diapo2"></label>
                <label for="diapo3"></label>
            </div>

        </section>
    </main>
<footer class="pie-pagina">
    <div class="redes-sociales">
        <a href="https://facebook.com" target="_blank" title="Facebook">Facebook</a>
        <a href="https://twitter.com" target="_blank" title="Twitter">Twitter</a>
        <a href="https://instagram.com" target="_blank" title="Instagram">Instagram</a>
    </div>
    <div class="datos-sitio">
        <p>© 2026 Institución Educativa GABO</p>
        <p>Cartago Valle - www.iegabo.edu.co</p>
    </div>
</footer>
</body>
</html>
